<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agistry</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0b0c; --panel:#141416; --panel2:#161618; --hover:#1a1a1d;
    --border:#262629; --border-soft:#1e1e21;
    --text:#ededef; --muted:#9596a0; --faint:#62636d;
    --green:#46b27f; --gray:#6b7280; --red:#dd6157; --amber:#cf9b46;
    --cyan:#5bc8d6;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:13px/1.5 var(--ui); background:var(--bg); color:var(--text);
         -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }

  header { display:flex; gap:14px; align-items:center; flex-wrap:wrap;
           padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel);
           flex:none; z-index:5; }
  .brand { display:flex; align-items:baseline; gap:10px; }
  h1 { font-size:14px; margin:0; font-weight:600; letter-spacing:-0.01em; }
  .summary { color:var(--muted); font-size:12px; }
  .grow { flex:1; }

  input, select, button {
    font:inherit; font-size:12px; color:var(--text); background:var(--bg);
    border:1px solid var(--border); border-radius:8px; padding:6px 10px; outline:none;
    transition:border-color .12s ease, background .12s ease;
  }
  input:focus, select:focus { border-color:#3a3a40; }
  input::placeholder { color:var(--faint); }
  button { cursor:pointer; }
  button:hover { background:var(--panel2); border-color:#3a3a40; }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:12px; user-select:none; }
  .status { padding:7px 20px; font-size:11.5px; color:var(--faint); flex:none; }
  .status.err { color:var(--red); }

  /* ---- view toggle ---- */
  .viewtog { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .viewtog button { border:none; border-radius:0; background:transparent; color:var(--muted);
       padding:6px 13px; font-size:12px; }
  .viewtog button:hover { background:var(--panel2); }
  .viewtog button.on { background:var(--hover); color:var(--text); box-shadow:inset 0 -2px 0 var(--cyan); }

  /* ---- main / views ---- */
  main { flex:1; min-height:0; position:relative; }
  .view { position:absolute; inset:0; overflow:auto; }
  .view[hidden] { display:none; }
  #tableView { overflow:auto; }

  /* ---- table ---- */
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 14px; white-space:nowrap; vertical-align:middle; }
  thead th { color:var(--faint); font-weight:500; font-size:10.5px; letter-spacing:.06em;
       text-transform:uppercase; position:sticky; top:0; background:var(--bg);
       border-bottom:1px solid var(--border); z-index:1; }
  tbody tr.member { border-bottom:1px solid var(--border-soft); }
  tbody tr.member:hover { background:var(--hover); }
  td.path, td.host { color:var(--muted); font-family:var(--mono); font-size:12px; }
  td.path { white-space:nowrap; max-width:300px; overflow:hidden; text-overflow:ellipsis; }
  td.sid { font-family:var(--mono); font-size:12px; color:var(--muted); }
  td.role { font-weight:500; }
  td.num { color:var(--muted); font-variant-numeric:tabular-nums; }
  td.seen { color:var(--faint); font-variant-numeric:tabular-nums; }

  tr.taskhdr td { padding:14px 14px 5px; }
  .taskhdr .tag { font-family:var(--mono); font-size:11px; color:var(--muted);
       text-transform:none; letter-spacing:0; background:var(--panel2);
       border:1px solid var(--border-soft); border-radius:6px; padding:2px 8px;
       display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis;
       white-space:nowrap; vertical-align:middle; }
  .taskhdr .none { color:var(--faint); font-style:italic; background:none; border:none; padding:0; }

  .chev { display:inline-block; color:var(--faint); cursor:pointer; user-select:none;
       transition:transform .15s ease, color .12s ease; width:14px; text-align:center; }
  td.caret { cursor:pointer; width:26px; text-align:center; }
  tr.member:hover .chev { color:var(--muted); }
  .chev.open { transform:rotate(90deg); color:var(--text); }

  .state { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
  .dot { width:7px; height:7px; border-radius:50%; flex:none; }
  .dot.active { background:var(--green); box-shadow:0 0 0 3px rgba(70,178,127,.12); }
  .dot.unassigned { background:var(--gray); }
  .dot.gone { background:var(--red); }
  .dot.delivered { background:var(--gray); }
  .dot.pending { background:var(--amber); }
  .dot.deadletter { background:var(--red); }

  /* resources are squares everywhere, so they never read as agents */
  .sq { width:8px; height:8px; border-radius:2px; flex:none; display:inline-block; vertical-align:middle; }
  .sq.free { box-shadow:inset 0 0 0 1.5px var(--muted); }
  .sq.held { background:#cfd0d6; }
  .sq.expiring { background:var(--amber); }
  .sq.gone { box-shadow:inset 0 0 0 1.5px var(--red); }

  .section { display:flex; align-items:baseline; gap:6px; padding:16px 14px 4px;
       color:var(--faint); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; }
  .section b { color:var(--muted); font-weight:500; }
  td.glyph { width:26px; text-align:center; }
  td.res-name { font-weight:500; }
  td.res-name .rid { display:block; font-family:var(--mono); font-size:11px; color:var(--faint); font-weight:400; }
  td.note { color:var(--muted); max-width:380px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.note .last { color:var(--faint); }

  tr.detail td { background:var(--panel2); padding:4px 14px 12px 40px;
       border-bottom:1px solid var(--border-soft); }
  .msgs { display:flex; flex-direction:column; }
  .nomsg { color:var(--faint); font-size:12px; padding:8px 0; }

  .msg { display:grid; grid-template-columns:40px 16px minmax(0,160px) 12px minmax(0,1fr);
       align-items:center; gap:10px; padding:5px 8px; border-radius:7px; cursor:pointer; }
  .msg:hover { background:var(--hover); }
  .m-time { color:var(--faint); font-size:11px; font-variant-numeric:tabular-nums; }
  .m-dir { color:var(--faint); text-align:center; }
  .m-dir.out { color:var(--muted); }
  .m-who { color:var(--text); font-family:var(--mono); font-size:11.5px;
       overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-prev { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .msg.open .m-prev { display:none; }

  .m-full { grid-column:1 / -1; margin:2px 0 6px; padding:10px 12px;
       background:var(--bg); border:1px solid var(--border-soft); border-radius:8px;
       font-family:var(--mono); font-size:12px; line-height:1.55; color:var(--text);
       white-space:pre-wrap; overflow-wrap:anywhere; }
  .m-meta { color:var(--faint); font-size:11px; margin-bottom:6px; font-family:var(--ui);
       display:flex; gap:10px; flex-wrap:wrap; }

  .empty { padding:64px; text-align:center; color:var(--faint); }

  /* ---- graph ---- */
  #graphView { overflow:hidden; }
  #graphCanvas { display:block; width:100%; height:100%; cursor:grab; }
  #graphCanvas.grabbing { cursor:grabbing; }
  #graphCanvas.pointing { cursor:pointer; }

  .graph-empty { position:absolute; inset:0; display:flex; align-items:center;
       justify-content:center; color:var(--faint); pointer-events:none; }

  .legend { position:absolute; left:16px; bottom:14px; display:flex; gap:14px; flex-wrap:wrap;
       padding:8px 12px; background:rgba(20,20,22,.72); border:1px solid var(--border-soft);
       border-radius:9px; backdrop-filter:blur(6px); font-size:11px; color:var(--muted);
       pointer-events:none; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .hint { position:absolute; right:16px; bottom:14px; padding:6px 11px;
       background:rgba(20,20,22,.72); border:1px solid var(--border-soft); border-radius:9px;
       backdrop-filter:blur(6px); font-size:11px; color:var(--faint); pointer-events:none; }

  /* node detail panel */
  #nodePanel { position:absolute; top:14px; right:14px; width:330px; max-width:calc(100% - 28px);
       max-height:calc(100% - 28px); overflow:auto; background:rgba(20,20,22,.92);
       border:1px solid var(--border); border-radius:12px; backdrop-filter:blur(10px);
       box-shadow:0 12px 40px rgba(0,0,0,.5); padding:14px 15px; }
  #nodePanel[hidden] { display:none; }
  .np-head { display:flex; align-items:center; gap:9px; margin-bottom:4px; }
  .np-role { font-size:14px; font-weight:600; }
  .np-close { margin-left:auto; cursor:pointer; color:var(--faint); border:none; background:none;
       font-size:16px; line-height:1; padding:2px 4px; border-radius:6px; }
  .np-close:hover { color:var(--text); background:var(--hover); }
  .np-grid { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:8px 0 10px;
       font-size:12px; }
  .np-grid dt { color:var(--faint); }
  .np-grid dd { margin:0; color:var(--muted); font-family:var(--mono); font-size:11.5px;
       overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .np-sec { color:var(--faint); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
       margin:10px 0 4px; }

  /* ---- agent panel as a chat ---- */
  #nodePanel.agent { width:410px; top:14px; bottom:14px; max-height:none; padding:0;
       display:flex; flex-direction:column; overflow:hidden; }
  #nodePanel.agent[hidden] { display:none; }
  /* expanded: wide enough to read a long handoff without scrolling sideways, but still
     leaving the graph visible behind it */
  #nodePanel.agent.wide { width:min(920px, calc(100% - 28px)); }
  .np-head .grow { flex:1; }
  .np-wide { cursor:pointer; color:var(--faint); border:none; background:none; font-size:13px;
       line-height:1; padding:3px 5px; border-radius:6px; }
  .np-wide:hover { color:var(--text); background:var(--hover); }
  .np-top { padding:13px 15px 4px; border-bottom:1px solid var(--border-soft); flex:none; }
  .np-top .np-grid { margin:6px 0 8px; }
  .badge { font-family:var(--mono); font-size:10.5px; color:var(--muted); background:var(--panel2);
       border:1px solid var(--border-soft); border-radius:5px; padding:0 6px; }
  .np-chat { flex:1; min-height:0; display:flex; flex-direction:column; }
  .np-with { flex:none; padding:9px 12px; border-bottom:1px solid var(--border-soft); color:var(--muted); font-size:12px; }
  .np-with select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border);
       border-radius:8px; padding:6px 8px; font:12px var(--ui); }
  .np-with-one { display:flex; gap:7px; align-items:center; min-height:28px; }
  .np-with-one b { color:var(--text); font-weight:500; }
  .np-thread { flex:1; overflow:auto; padding:4px 12px 14px; display:flex; flex-direction:column; }
  /* like a chat app, a short conversation sits at the bottom, next to where new messages arrive.
     An id selector, so the later .daysep / .earlier margin shorthands cannot reset it. */
  #npThread > :first-child { margin-top:auto; }
  .np-thread .earlier { align-self:center; margin:8px 0 4px; font-size:11.5px; }
  .np-thread .daysep { align-self:center; margin:12px 0 4px; color:var(--faint); font-size:10px;
       letter-spacing:.06em; text-transform:uppercase; }
  .np-thread .row { display:flex; max-width:min(86%, 640px); margin-top:3px; }
  .np-thread .row.turn { margin-top:10px; }
  .np-thread .row.left { align-self:flex-start; }
  .np-thread .row.right { align-self:flex-end; }
  .np-thread .bubble { padding:7px 10px 5px; border-radius:13px; white-space:pre-wrap; overflow-wrap:anywhere;
       line-height:1.45; font-size:12.5px; color:var(--text); min-width:64px; }
  .np-thread .left .bubble { background:var(--panel2); border:1px solid var(--border-soft); border-bottom-left-radius:4px; }
  .np-thread .right .bubble { background:rgba(91,200,214,.11); border:1px solid rgba(91,200,214,.22); border-bottom-right-radius:4px; }
  .np-thread .bubble-foot { display:flex; gap:6px; justify-content:flex-end; align-items:center; margin-top:3px;
       color:var(--faint); font-size:10px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .np-thread .mark.pend { color:var(--amber); }
  .np-thread .mark.dead { color:var(--red); }
  .np-thread .more { display:block; background:none; border:none; padding:2px 0 0; color:var(--cyan); font-size:11.5px; }
  .np-thread .more:hover { background:none; text-decoration:underline; }
  .np-thread .chat-empty { margin:auto; padding:24px 10px; color:var(--faint); text-align:center; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>agistry</h1><span id="summary" class="summary"></span></div>
  <span class="grow"></span>
  <div class="viewtog" id="viewtog">
    <button data-view="graph">Graph</button>
    <button data-view="table">Table</button>
  </div>
  <input id="tok" type="password" placeholder="registry token" size="20">
  <label class="chk"><input id="gone" type="checkbox"> gone</label>
  <label class="chk" id="idleWrap"><input id="idle" type="checkbox"> idle</label>
  <select id="every">
    <option value="2000">2s</option>
    <option value="5000" selected>5s</option>
    <option value="10000">10s</option>
    <option value="0">off</option>
  </select>
  <button id="refresh">Refresh</button>
</header>
<div id="status" class="status"></div>

<main>
  <div id="graphView" class="view">
    <canvas id="graphCanvas"></canvas>
    <div id="graphEmpty" class="graph-empty">no agents to plot</div>
    <div class="legend">
      <span><span class="dot active"></span>active</span>
      <span><span class="dot unassigned"></span>idle</span>
      <span><span class="dot gone"></span>gone</span>
      <span><span class="dot pending"></span>pending msg</span>
      <span style="color:var(--cyan)">— ◦→ live message</span>
      <span><span class="sq free"></span>free resource</span>
      <span><span class="sq held"></span>held</span>
      <span><span class="sq expiring"></span>ending soon</span>
    </div>
    <div class="hint">drag node · scroll zoom · click for detail</div>
    <div id="nodePanel" hidden></div>
  </div>

  <div id="tableView" class="view" hidden>
    <div id="body"></div>
  </div>
</main>

<script>
(function(){
  var tok = document.getElementById('tok');
  var gone = document.getElementById('gone');
  var idle = document.getElementById('idle');
  var idleWrap = document.getElementById('idleWrap');
  var every = document.getElementById('every');
  var body = document.getElementById('body');
  var statusEl = document.getElementById('status');
  var summary = document.getElementById('summary');
  var viewtog = document.getElementById('viewtog');
  var graphView = document.getElementById('graphView');
  var tableView = document.getElementById('tableView');
  var timer = null;

  tok.value = localStorage.getItem('registry_token') || '';
  var view = localStorage.getItem('agistry_view') || 'graph';

  function rel(ts){
    var s = Math.floor(Date.now()/1000) - ts;
    if (s < 0) s = 0;
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s/60) + 'm';
    if (s < 86400) return Math.floor(s/3600) + 'h';
    return Math.floor(s/86400) + 'd';
  }
  function esc(x){
    return String(x==null?'':x).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  var expanded = {};      // session_id -> open (table)
  var expandedMsg = {};   // msg_id -> open (table)
  var lastAgents = { agents: [] };
  var lastMessages = [];
  var lastResources = [];
  var resFetchedAt = 0;   // ms; see leaseLeft

  function messagesFor(a){
    var sid = a.session_id;
    return lastMessages.filter(function(m){
      if (m.from === sid) return true;
      if (m.to_session === sid) return true;
      if (!m.to_session && m.to_task && m.to_task === a.task && (m.to_role === a.role || !m.to_role)) return true;
      return false;
    });
  }

  function msgStatus(m){
    if (m.dead_lettered) return 'deadletter';
    if (m.delivered) return 'delivered';
    return 'pending';
  }

  // seconds -> "5h 59m" / "12m" / "40s"
  function dur(s){
    s = Math.max(0, Math.floor(s));
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s/60) + 'm';
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    return h + 'h' + (m ? ' ' + m + 'm' : '');
  }

  // Seconds left on a hold. Uses the server's expires_in minus the time since the fetch,
  // not expires_at against the local clock, so a skewed browser clock cannot misreport it.
  function leaseLeft(r){
    if (!r.lease) return 0;
    return r.lease.expires_in - (Date.now() - resFetchedAt)/1000;
  }
  var EXPIRING_SOON = 600; // same window as the server's at_max_hold warning

  function resState(r){
    if (r.state === 'gone') return 'gone';
    if (!r.held) return 'free';
    return leaseLeft(r) <= EXPIRING_SOON ? 'expiring' : 'held';
  }

  // task:role for a lease holder. A standing lease carries it; a finished one has only
  // the session id, so look that up among the agents we have.
  function holderLabel(l){
    if (!l) return '';
    if (l.holder_task || l.holder_role) return (l.holder_task || '?') + ':' + (l.holder_role || '?');
    var a = lastAgents.agents || [];
    for (var i = 0; i < a.length; i++){
      if (a[i].session_id === l.holder && (a[i].task || a[i].role)) return (a[i].task || '?') + ':' + (a[i].role || '?');
    }
    return (l.holder || '').slice(0, 8);
  }

  // =====================================================================
  //  TABLE VIEW
  // =====================================================================
  function detailHtml(a){
    var ms = messagesFor(a);
    if (!ms.length) return '<div class="nomsg">no recent messages</div>';
    var out = ['<div class="msgs">'];
    ms.forEach(function(m){
      var outgoing = m.from === a.session_id;
      var whoFull = outgoing ? (m.to_session || ((m.to_task||'') + ':' + (m.to_role||''))) : (m.from || '');
      var who = outgoing
        ? (m.to_session ? m.to_session.slice(0,8) : ((m.to_task||'') + ':' + (m.to_role||'')))
        : (m.from || '').slice(0,8);
      var st = msgStatus(m);
      var open = !!expandedMsg[m.msg_id];
      out.push('<div class="msg' + (open?' open':'') + '" data-mid="' + esc(m.msg_id) + '">' +
        '<span class="m-time">' + rel(m.created_at) + '</span>' +
        '<span class="m-dir' + (outgoing?' out':'') + '">' + (outgoing ? '↗' : '↙') + '</span>' +
        '<span class="m-who" title="' + esc(whoFull) + '">' + esc(who) + '</span>' +
        '<span class="dot ' + st + '" title="' + st + '"></span>' +
        '<span class="m-prev">' + esc(m.body || '') + '</span>' +
        (open ? '<div class="m-full"><div class="m-meta"><span>' + (outgoing?'to ':'from ') + esc(whoFull) + '</span><span>' + st + '</span><span>' + rel(m.created_at) + ' ago</span></div>' + esc(m.body || '') + '</div>' : '') +
      '</div>');
    });
    out.push('</div>');
    return out.join('');
  }

  function resourcesTableHtml(){
    var rs = lastResources;
    if (!rs.length) return '';
    var held = rs.filter(function(r){ return r.held; }).length;
    var out = ['<div class="section">resources <b>' + rs.length + '</b> · <b>' + held + '</b> held</div>',
      '<table><thead><tr>',
      '<th></th><th>Resource</th><th>Kind</th><th>Host</th><th>Holder</th><th>Expires</th><th>Note</th>',
      '</tr></thead><tbody>'];
    rs.forEach(function(r){
      var st = resState(r);
      var holder = '<span class="last">—</span>', expires = '—', note = '', title = '';
      if (r.held){
        holder = '<span title="' + esc(r.lease.holder) + '">' + esc(holderLabel(r.lease)) + '</span>';
        expires = 'in ' + dur(leaseLeft(r));
        note = esc(r.lease.note || '');
        title = r.lease.note || '';
      } else if (r.last_lease){
        // free, but say what the last holder left on it: that decides whether to reinstall
        var l = r.last_lease;
        note = '<span class="last">last · ' + esc(holderLabel(l)) + ' · ' + rel(l.released_at) + ' ago' +
               (l.note ? ' — </span>' + esc(l.note) : '</span>');
        title = l.note || '';
      }
      out.push('<tr class="member">' +
        '<td class="glyph"><span class="sq ' + st + '" title="' + st + '"></span></td>' +
        '<td class="res-name">' + esc(r.name || r.id) + '<span class="rid">' + esc(r.id) + '</span></td>' +
        '<td class="host">' + esc(r.kind || '—') + '</td>' +
        '<td class="host">' + esc(r.host || '—') + '</td>' +
        '<td class="sid">' + holder + '</td>' +
        '<td class="num">' + expires + '</td>' +
        '<td class="note" title="' + esc(title) + '">' + (note || '<span class="last">—</span>') + '</td>' +
      '</tr>');
    });
    out.push('</tbody></table>');
    return out.join('');
  }

  function renderTable(){
    var a = lastAgents.agents || [];
    var resHtml = resourcesTableHtml();
    if (!a.length){ body.innerHTML = resHtml + '<div class="empty">no agents registered</div>'; return; }
    var rows = [resHtml, resHtml ? '<div class="section">agents <b>' + a.length + '</b></div>' : '',
      '<table><thead><tr>',
      '<th></th><th>Role</th><th>State</th><th>Session</th><th>Host</th>',
      '<th>Msgs</th><th>Seen</th><th>Cwd</th></tr></thead><tbody>'];
    var lastTask = null;
    a.forEach(function(x){
      if (x.task !== lastTask){
        lastTask = x.task;
        var tk = x.task || '';
        var tag = tk ? '<span class="tag" title="' + esc(tk) + '">' + esc(tk) + '</span>'
                     : '<span class="none">no task</span>';
        rows.push('<tr class="taskhdr"><td colspan="8">' + tag + '</td></tr>');
      }
      var open = !!expanded[x.session_id];
      var mc = messagesFor(x).length;
      rows.push('<tr class="member">' +
        '<td class="caret" data-sid="' + esc(x.session_id) + '"><span class="chev' + (open?' open':'') + '">›</span></td>' +
        '<td class="role">' + esc(x.role || '—') + '</td>' +
        '<td><span class="state"><span class="dot ' + esc(x.state||'unassigned') + '"></span>' + esc(x.state) + '</span></td>' +
        '<td class="sid" title="' + esc(x.session_id) + '">' + esc((x.session_id||'').slice(0,8)) + '</td>' +
        '<td class="host">' + esc(x.host || '—') + '</td>' +
        '<td class="num">' + (mc || '') + '</td>' +
        '<td class="seen">' + rel(x.last_seen) + '</td>' +
        '<td class="path" title="' + esc(x.cwd||'') + '">' + esc(x.cwd || '—') + '</td>' +
      '</tr>');
      if (open){
        rows.push('<tr class="detail"><td colspan="8">' + detailHtml(x) + '</td></tr>');
      }
    });
    rows.push('</tbody></table>');
    body.innerHTML = rows.join('');
  }

  body.addEventListener('click', function(e){
    var n = e.target;
    while (n && n !== body){
      if (n.classList && n.classList.contains('msg')){
        var mid = n.getAttribute('data-mid');
        if (mid){ expandedMsg[mid] = !expandedMsg[mid]; renderTable(); }
        return;
      }
      if (n.classList && n.classList.contains('caret')){
        var sid = n.getAttribute('data-sid');
        if (sid){ expanded[sid] = !expanded[sid]; renderTable(); }
        return;
      }
      n = n.parentNode;
    }
  });

  // =====================================================================
  //  GRAPH VIEW  — hand-rolled canvas force layout, no dependencies
  // =====================================================================
  var canvas = document.getElementById('graphCanvas');
  var graphEmpty = document.getElementById('graphEmpty');
  var nodePanel = document.getElementById('nodePanel');
  var ctx = canvas.getContext('2d');

  var COL = {
    active:'#46b27f', unassigned:'#6b7280', gone:'#dd6157',
    cyan:'#5bc8d6', amber:'#cf9b46', red:'#dd6157', edge:'#33343a'
  };

  var nodesById = {};     // session_id -> node (persisted across reloads for stable layout)
  var nodes = [];         // current visible node list
  var links = [];         // {a, b, dir:[{from,to}], msgs:[...]}  (b is target)
  var linkByKey = {};
  var leaseLinks = [];    // {from: 'res:<id>', to: holder session_id, res}
  var hostCentroids = {}; // host -> {x,y,n}
  var seenMsg = {};       // msg_id -> client perf time first observed (for pulse animation)
  var firstLoad = true;

  var cam = { x:0, y:0, scale:1, init:false };
  var hover = null, selected = null, dragging = null, dragMoved = false;
  var pointer = { x:0, y:0, down:false, downX:0, downY:0, panX:0, panY:0 };
  var rafId = null, lastT = 0;

  var PULSE_MS = 1500;       // travel time of a message pulse along an edge
  var PULSE_RECENT = 45;     // server-seconds: only animate genuinely recent messages

  function dpr(){ return window.devicePixelRatio || 1; }

  function resizeCanvas(){
    var r = canvas.getBoundingClientRect();
    var d = dpr();
    canvas.width = Math.max(1, Math.round(r.width * d));
    canvas.height = Math.max(1, Math.round(r.height * d));
  }
  window.addEventListener('resize', function(){ resizeCanvas(); if (!cam.init) centerCamera(); });

  function w2s(x, y){ return { x: x*cam.scale + cam.x, y: y*cam.scale + cam.y }; }
  function s2w(x, y){ return { x: (x-cam.x)/cam.scale, y: (y-cam.y)/cam.scale }; }

  function viewSize(){ var d = dpr(); return { w: canvas.width/d, h: canvas.height/d }; }

  function nodeRadius(n){
    if (n.kind === 'resource') return 7.5;
    var base = 6 + Math.min(14, n.deg * 2.2);
    if (n.idle) base = 4.5;
    return base;
  }

  function isIdle(a){
    return a.state !== 'active' && !a.role && !a.host;
  }

  // resolve a message to the set of recipient session_ids that are present as nodes
  function targetsOf(m){
    if (m.to_session){
      return nodesById[m.to_session] ? [m.to_session] : [];
    }
    if (!m.to_task) return [];
    var out = [];
    nodes.forEach(function(n){
      if (n.task === m.to_task && (n.role === m.to_role || !m.to_role)) out.push(n.id);
    });
    return out;
  }

  function buildGraph(){
    var agents = (lastAgents.agents || []).slice();
    var showIdle = idle.checked;

    // figure out which agents are visible
    var visible = agents.filter(function(a){ return showIdle || !isIdle(a); });
    var visIds = {};
    visible.forEach(function(a){ visIds[a.session_id] = true; });

    // reconcile node objects (keep positions for ones that persist)
    var next = [];
    nodes = []; // rebuilt below; targetsOf reads `nodes`, so set after
    var vs = viewSize();
    visible.forEach(function(a){
      var n = nodesById[a.session_id];
      if (!n){
        // spawn near center with a little spread
        var ang = (next.length * 2.399963); // golden angle scatter
        var rad = 40 + next.length * 6;
        n = { id:a.session_id, x: Math.cos(ang)*rad + (Math.random()-0.5)*20,
              y: Math.sin(ang)*rad + (Math.random()-0.5)*20, vx:0, vy:0 };
        nodesById[a.session_id] = n;
      }
      n.role = a.role || '';
      n.task = a.task || '';
      n.host = a.host || '';
      n.cwd = a.cwd || '';
      n.state = a.state || 'unassigned';
      n.last_seen = a.last_seen;
      n.idle = isIdle(a);
      n.deg = 0;
      next.push(n);
    });
    // resources: square nodes that join their host cluster like agents do
    lastResources.forEach(function(r, i){
      var id = 'res:' + r.id;
      visIds[id] = true;
      var n = nodesById[id];
      if (!n){
        var ang = i * 2.399963 + 1.2, rad = 120 + i * 8;
        n = { id:id, x: Math.cos(ang)*rad, y: Math.sin(ang)*rad, vx:0, vy:0 };
        nodesById[id] = n;
      }
      n.kind = 'resource';
      n.res = r;
      n.host = r.host || '';
      n.label = r.name || r.id;
      n.deg = 0;
      next.push(n);
    });
    nodes = next;

    // drop stale node objects
    Object.keys(nodesById).forEach(function(id){ if (!visIds[id]) delete nodesById[id]; });

    // build links from messages
    links = []; linkByKey = {};
    lastMessages.forEach(function(m){
      var from = m.from;
      if (!from || !nodesById[from]) return;
      var tgts = targetsOf(m);
      tgts.forEach(function(to){
        if (to === from) return;
        var key = from + '' + to;
        var l = linkByKey[key];
        if (!l){ l = { from:from, to:to, msgs:[] }; linkByKey[key] = l; links.push(l); }
        l.msgs.push(m);
        nodesById[from].deg++;
        nodesById[to].deg++;
      });
    });

    // lease edges: a held resource is tied to its holder (if that agent is on screen)
    leaseLinks = [];
    lastResources.forEach(function(r){
      if (!r.held || !r.lease || !nodesById[r.lease.holder]) return;
      leaseLinks.push({ from: 'res:' + r.id, to: r.lease.holder, res: r });
    });

    // stamp messages for pulse animation
    var nowMs = performance.now();
    var serverNow = Math.floor(Date.now()/1000);
    lastMessages.forEach(function(m){
      if (seenMsg[m.msg_id] != null) return;
      if (firstLoad){
        seenMsg[m.msg_id] = -1; // pre-existing; never pulse
      } else if ((serverNow - m.created_at) <= PULSE_RECENT){
        seenMsg[m.msg_id] = nowMs; // newly arrived & recent → animate
      } else {
        seenMsg[m.msg_id] = -1;
      }
    });
    firstLoad = false;

    graphEmpty.style.display = nodes.length ? 'none' : 'flex';

    if (selected && !nodesById[selected]) { selected = null; nodePanel.hidden = true; }
    if (selected) renderNodePanel(nodesById[selected]);

    if (!cam.init && nodes.length) centerCamera();
  }

  function centerCamera(){
    var vs = viewSize();
    cam.x = vs.w/2; cam.y = vs.h/2; cam.scale = 1; cam.init = true;
  }

  // ---- physics ----
  function step(dt){
    var n = nodes.length;
    if (!n) return;
    var REPULSE = 5200, SPRING = 0.012, REST = 95, CENTER = 0.0016, HOSTPULL = 0.010, DAMP = 0.86;

    // host centroids
    hostCentroids = {};
    nodes.forEach(function(a){
      if (!a.host) return;
      var c = hostCentroids[a.host] || (hostCentroids[a.host] = {x:0,y:0,n:0});
      c.x += a.x; c.y += a.y; c.n++;
    });
    Object.keys(hostCentroids).forEach(function(h){ var c=hostCentroids[h]; c.x/=c.n; c.y/=c.n; });

    // repulsion (O(n^2); n is small)
    for (var i=0;i<n;i++){
      var p = nodes[i];
      for (var j=i+1;j<n;j++){
        var q = nodes[j];
        var dx = p.x-q.x, dy = p.y-q.y;
        var d2 = dx*dx+dy*dy; if (d2 < 0.01) { dx = (Math.random()-0.5); dy=(Math.random()-0.5); d2 = 0.01; }
        var d = Math.sqrt(d2);
        var f = REPULSE / d2;
        var fx = f*dx/d, fy = f*dy/d;
        p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
      }
    }
    // springs along links
    links.forEach(function(l){
      var p = nodesById[l.from], q = nodesById[l.to];
      if (!p || !q) return;
      var dx = q.x-p.x, dy = q.y-p.y;
      var d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      var f = SPRING * (d - REST);
      var fx = f*dx/d, fy = f*dy/d;
      p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
    });
    // lease edges pull a held resource in close to its holder
    leaseLinks.forEach(function(l){
      var p = nodesById[l.from], q = nodesById[l.to];
      if (!p || !q) return;
      var dx = q.x-p.x, dy = q.y-p.y;
      var d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      var f = 0.02 * (d - 58);
      var fx = f*dx/d, fy = f*dy/d;
      p.vx += fx; p.vy += fy; q.vx -= fx; q.vy -= fy;
    });
    // gravity to center + to host cluster
    nodes.forEach(function(p){
      p.vx += -p.x*CENTER; p.vy += -p.y*CENTER;
      if (p.host){
        var c = hostCentroids[p.host];
        if (c){ p.vx += (c.x-p.x)*HOSTPULL; p.vy += (c.y-p.y)*HOSTPULL; }
      }
    });
    // integrate
    nodes.forEach(function(p){
      if (p === dragging) { p.vx = 0; p.vy = 0; return; }
      p.vx *= DAMP; p.vy *= DAMP;
      var sp = Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      if (sp > 30){ p.vx = p.vx/sp*30; p.vy = p.vy/sp*30; }
      p.x += p.vx; p.y += p.vy;
    });
  }

  // ---- drawing ----
  function draw(t){
    var d = dpr();
    ctx.setTransform(d,0,0,d,0,0);
    var vs = viewSize();
    ctx.clearRect(0,0,vs.w,vs.h);

    drawGrid(vs);

    // host cluster halos + labels
    Object.keys(hostCentroids).forEach(function(h){
      var c = hostCentroids[h];
      var s = w2s(c.x, c.y);
      // radius from member spread
      var maxr = 70;
      nodes.forEach(function(p){ if (p.host===h){ var dx=p.x-c.x, dy=p.y-c.y; maxr = Math.max(maxr, Math.sqrt(dx*dx+dy*dy)+40); } });
      var rr = maxr * cam.scale;
      var g = ctx.createRadialGradient(s.x,s.y,rr*0.2, s.x,s.y,rr);
      g.addColorStop(0,'rgba(91,200,214,0.06)');
      g.addColorStop(1,'rgba(91,200,214,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(149,150,160,0.55)';
      ctx.font = '11px ' + getComputedStyle(document.body).getPropertyValue('--mono');
      ctx.textAlign = 'center';
      ctx.fillText('▦ ' + h, s.x, s.y - rr + 4);
    });

    var hoverNeighbors = {};
    if (hover){
      hoverNeighbors[hover.id] = true;
      links.forEach(function(l){ if (l.from===hover.id) hoverNeighbors[l.to]=true; if (l.to===hover.id) hoverNeighbors[l.from]=true; });
      leaseLinks.forEach(function(l){ if (l.from===hover.id) hoverNeighbors[l.to]=true; if (l.to===hover.id) hoverNeighbors[l.from]=true; });
    }

    // lease edges, under message edges: solid and neutral, since "held by" is not traffic
    leaseLinks.forEach(function(l){
      var p = nodesById[l.from], q = nodesById[l.to];
      if (!p || !q) return;
      var sp = w2s(p.x,p.y), sq = w2s(q.x,q.y);
      var related = !hover || hover.id===l.from || hover.id===l.to;
      var ending = resState(l.res) === 'expiring';
      ctx.save();
      ctx.lineWidth = related ? 2 : 1.2;
      ctx.strokeStyle = ending
        ? (related ? 'rgba(207,155,70,0.7)' : 'rgba(207,155,70,0.2)')
        : (related ? 'rgba(207,208,214,0.45)' : 'rgba(207,208,214,0.12)');
      ctx.beginPath(); ctx.moveTo(sp.x,sp.y); ctx.lineTo(sq.x,sq.y); ctx.stroke();
      ctx.restore();
    });

    // edges
    links.forEach(function(l){
      var p = nodesById[l.from], q = nodesById[l.to];
      if (!p || !q) return;
      var sp = w2s(p.x,p.y), sq = w2s(q.x,q.y);
      var related = !hover || (hover.id===l.from || hover.id===l.to);
      var last = l.msgs[l.msgs.length-1];
      var st = last ? msgStatus(last) : 'delivered';

      ctx.save();
      ctx.lineWidth = related ? 1.4 : 1;
      if (st === 'pending'){ ctx.strokeStyle = related ? 'rgba(207,155,70,0.55)' : 'rgba(207,155,70,0.18)'; ctx.setLineDash([4,4]); }
      else if (st === 'deadletter'){ ctx.strokeStyle = related ? 'rgba(221,97,87,0.5)' : 'rgba(221,97,87,0.16)'; ctx.setLineDash([2,5]); }
      else { ctx.strokeStyle = related ? 'rgba(91,200,214,0.32)' : 'rgba(91,200,214,0.10)'; }
      // subtle directional brightening: draw with a gradient
      var grad = ctx.createLinearGradient(sp.x,sp.y,sq.x,sq.y);
      if (st==='delivered'){
        grad.addColorStop(0, related?'rgba(91,200,214,0.05)':'rgba(91,200,214,0.03)');
        grad.addColorStop(1, related?'rgba(91,200,214,0.40)':'rgba(91,200,214,0.12)');
        ctx.strokeStyle = grad;
      }
      ctx.beginPath(); ctx.moveTo(sp.x,sp.y); ctx.lineTo(sq.x,sq.y); ctx.stroke();
      ctx.restore();

      // arrowhead near target
      drawArrow(sp, sq, nodeRadius(q)*cam.scale + 3, related ? 0.5 : 0.18);

      // live message pulses
      l.msgs.forEach(function(m){
        var born = seenMsg[m.msg_id];
        if (born == null || born < 0) return;
        var prog = (t - born) / PULSE_MS;
        if (prog < 0 || prog > 1) return;
        var e = prog<0.5 ? 2*prog*prog : 1-Math.pow(-2*prog+2,2)/2; // easeInOut
        var px = sp.x + (sq.x-sp.x)*e, py = sp.y + (sq.y-sp.y)*e;
        var alpha = Math.sin(prog*Math.PI);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = COL.cyan; ctx.shadowBlur = 12;
        ctx.fillStyle = COL.cyan;
        ctx.beginPath(); ctx.arc(px,py,3.2,0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
    });

    // nodes
    nodes.forEach(function(p){
      if (p.kind === 'resource'){ drawResource(p, hover && !hoverNeighbors[p.id]); return; }
      var s = w2s(p.x,p.y);
      var r = nodeRadius(p) * cam.scale;
      var col = COL[p.state] || COL.unassigned;
      var dim = hover && !hoverNeighbors[p.id];
      var isActive = p.state === 'active';

      ctx.save();
      ctx.globalAlpha = dim ? 0.28 : 1;
      // glow ring for active
      if (isActive && !dim){
        ctx.shadowColor = col; ctx.shadowBlur = 16;
      }
      // body
      ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2);
      ctx.fillStyle = p.idle ? 'rgba(107,114,128,0.5)' : col;
      ctx.fill();
      ctx.shadowBlur = 0;
      // ring
      ctx.lineWidth = (p.id === selected) ? 2.4 : 1.2;
      ctx.strokeStyle = (p.id === selected) ? COL.cyan : 'rgba(11,11,12,0.9)';
      ctx.stroke();
      if (p === hover){
        ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(237,237,239,0.6)';
        ctx.beginPath(); ctx.arc(s.x,s.y,r+3,0,Math.PI*2); ctx.stroke();
      }
      ctx.restore();

      // label (role or short sid) — hide for idle unless zoomed/hover
      if (!p.idle || hover===p || cam.scale > 1.4){
        var label = p.role || (p.id||'').slice(0,6);
        ctx.save();
        ctx.globalAlpha = dim ? 0.3 : 0.92;
        ctx.fillStyle = '#cfd0d6';
        ctx.font = (p.role?'600 ':'') + '11px ' + getComputedStyle(document.body).getPropertyValue('--ui');
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(label, s.x, s.y + r + 4);
        ctx.restore();
      }
    });
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  // Filled = held, hollow = free, amber = hold ending soon, red outline = gone.
  function drawResource(p, dim){
    var s = w2s(p.x,p.y);
    var h = 6.5 * cam.scale;   // half side
    var st = resState(p.res);
    ctx.save();
    ctx.globalAlpha = dim ? 0.28 : 1;
    roundRect(s.x-h, s.y-h, h*2, h*2, 2.5*cam.scale);
    if (st === 'held' || st === 'expiring'){
      ctx.fillStyle = st === 'expiring' ? COL.amber : '#cfd0d6';
      if (!dim){ ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10; }
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = 'rgba(20,20,22,1)';
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = st === 'gone' ? COL.red : 'rgba(149,150,160,0.9)';
      ctx.stroke();
    }
    if (p.id === selected || p === hover){
      ctx.lineWidth = p.id === selected ? 2 : 1.5;
      ctx.strokeStyle = p.id === selected ? COL.cyan : 'rgba(237,237,239,0.6)';
      roundRect(s.x-h-3, s.y-h-3, h*2+6, h*2+6, 4*cam.scale);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = dim ? 0.3 : 0.85;
    ctx.fillStyle = '#9596a0';
    ctx.font = '10.5px ' + getComputedStyle(document.body).getPropertyValue('--mono');
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(p.label, s.x, s.y + h + 5);
    ctx.restore();
  }

  function drawArrow(sp, sq, backoff, alpha){
    var dx = sq.x-sp.x, dy = sq.y-sp.y;
    var d = Math.sqrt(dx*dx+dy*dy) || 1;
    var ux = dx/d, uy = dy/d;
    var tipX = sq.x - ux*backoff, tipY = sq.y - uy*backoff;
    var size = 5;
    var ang = Math.atan2(uy,ux);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COL.cyan;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - size*Math.cos(ang - 0.5), tipY - size*Math.sin(ang - 0.5));
    ctx.lineTo(tipX - size*Math.cos(ang + 0.5), tipY - size*Math.sin(ang + 0.5));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawGrid(vs){
    var spacing = 38 * cam.scale;
    if (spacing < 14) spacing = spacing * Math.ceil(14/spacing);
    var ox = cam.x % spacing, oy = cam.y % spacing;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.022)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x=ox; x<vs.w; x+=spacing){ ctx.moveTo(x,0); ctx.lineTo(x,vs.h); }
    for (var y=oy; y<vs.h; y+=spacing){ ctx.moveTo(0,y); ctx.lineTo(vs.w,y); }
    ctx.stroke();
    ctx.restore();
  }

  function tick(t){
    if (!lastT) lastT = t;
    var dt = Math.min(2, (t-lastT)/16.67); lastT = t;
    if (view === 'graph'){
      step(dt);
      draw(t);
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
    }
  }
  function startGraph(){
    resizeCanvas();
    if (!cam.init) centerCamera();
    if (!rafId){ lastT = 0; rafId = requestAnimationFrame(tick); }
  }
  function stopGraph(){ if (rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  // ---- interaction ----
  function pickNode(sx, sy){
    var best = null, bestD = Infinity;
    for (var i=nodes.length-1;i>=0;i--){
      var p = nodes[i];
      var s = w2s(p.x,p.y);
      var r = nodeRadius(p)*cam.scale + 4;
      var dx = sx-s.x, dy = sy-s.y, dd = dx*dx+dy*dy;
      if (dd <= r*r && dd < bestD){ bestD = dd; best = p; }
    }
    return best;
  }
  function localXY(e){
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('mousedown', function(e){
    var p = localXY(e);
    pointer.down = true; pointer.downX = p.x; pointer.downY = p.y;
    pointer.panX = cam.x; pointer.panY = cam.y;
    dragMoved = false;
    var hit = pickNode(p.x,p.y);
    dragging = hit;
    canvas.classList.add('grabbing');
  });
  window.addEventListener('mousemove', function(e){
    var p = localXY(e);
    pointer.x = p.x; pointer.y = p.y;
    if (pointer.down){
      var ddx = p.x-pointer.downX, ddy = p.y-pointer.downY;
      if (Math.abs(ddx)+Math.abs(ddy) > 3) dragMoved = true;
      if (dragging){
        var wpt = s2w(p.x,p.y);
        dragging.x = wpt.x; dragging.y = wpt.y; dragging.vx = 0; dragging.vy = 0;
      } else {
        cam.x = pointer.panX + ddx; cam.y = pointer.panY + ddy;
      }
    } else if (view==='graph'){
      hover = pickNode(p.x,p.y);
      canvas.classList.toggle('pointing', !!hover);
    }
  });
  window.addEventListener('mouseup', function(e){
    if (pointer.down && !dragMoved){
      var hit = dragging || pickNode(pointer.x, pointer.y);
      if (hit){ selected = hit.id; renderNodePanel(hit); nodePanel.hidden = false; }
      else { selected = null; nodePanel.hidden = true; }
    }
    pointer.down = false; dragging = null;
    canvas.classList.remove('grabbing');
  });
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    var p = localXY(e);
    var before = s2w(p.x,p.y);
    var k = Math.exp(-e.deltaY * 0.0014);
    cam.scale = Math.max(0.3, Math.min(3.5, cam.scale*k));
    var after = w2s(before.x, before.y);
    cam.x += p.x - after.x; cam.y += p.y - after.y;
  }, { passive:false });

  // released_by is a code; say what happened in words
  function releasedHow(code){
    return { 'holder':'handed back', 'expired':'expired', 'holder-gone':'holder died',
             'resource-gone':'resource retired' }[code] || code || '';
  }

  function renderResourcePanel(n){
    var r = n.res, st = resState(r);
    var h = ['<div class="np-head">',
      '<span class="sq ' + st + '"></span>',
      '<span class="np-role">' + esc(r.name || r.id) + '</span>',
      '<button class="np-close" id="npClose">×</button></div>'];
    h.push('<dl class="np-grid">');
    h.push('<dt>status</dt><dd>' + esc(st === 'expiring' ? 'held · ending soon' : st) + '</dd>');
    h.push('<dt>id</dt><dd title="'+esc(r.id)+'">' + esc(r.id) + '</dd>');
    h.push('<dt>kind</dt><dd>' + esc(r.kind || '—') + '</dd>');
    h.push('<dt>host</dt><dd>' + esc(r.host || '—') + '</dd>');
    h.push('<dt>max hold</dt><dd>' + dur(r.max_hold_seconds) + '</dd>');
    if (r.held){
      h.push('<dt>holder</dt><dd title="'+esc(r.lease.holder)+'">' + esc(holderLabel(r.lease)) + '</dd>');
      h.push('<dt>since</dt><dd>' + rel(r.lease.acquired_at) + ' ago</dd>');
      h.push('<dt>expires</dt><dd>in ' + dur(leaseLeft(r)) + '</dd>');
    }
    if (r.meta && typeof r.meta === 'object' && !Array.isArray(r.meta)){
      Object.keys(r.meta).slice(0, 6).forEach(function(k){
        var v = r.meta[k];
        if (v === '' || v == null || typeof v === 'object') return;
        h.push('<dt>' + esc(k) + '</dt><dd title="'+esc(v)+'">' + esc(v) + '</dd>');
      });
    }
    h.push('</dl>');
    if (r.held){
      h.push('<div class="np-sec">note</div>');
      h.push(r.lease.note ? '<div class="m-full">' + esc(r.lease.note) + '</div>' : '<div class="nomsg">no note</div>');
    }
    if (r.last_lease){
      var l = r.last_lease;
      h.push('<div class="np-sec">last hold</div>');
      h.push('<div class="m-full"><div class="m-meta"><span>' + esc(holderLabel(l)) + '</span><span>' +
        esc(releasedHow(l.released_by)) + '</span><span>' + rel(l.released_at) + ' ago</span></div>' +
        esc(l.note || 'no note') + '</div>');
    }
    nodePanel.innerHTML = h.join('');
    var cl = document.getElementById('npClose');
    if (cl) cl.onclick = function(){ selected = null; nodePanel.hidden = true; };
  }

  // =====================================================================
  //  AGENT PANEL AS A CHAT
  // =====================================================================
  // Clicking an agent shows one of its conversations as a chat, the agent's own messages
  // on the right, with a picker when it has talked to more than one agent. Loading follows
  // what is on screen: the picker is a server-side summary, a conversation opens on its
  // newest page, and earlier pages load only on request. The panel is re-rendered on every
  // poll, so it builds its frame once per selected agent and then updates in place,
  // leaving the picker, the scroll position and any text selection alone.
  var pchat = { sid:null, me:'', convs:[], convsLoaded:false, convSig:'', withId:'', msgs:[], hasMore:false,
                seq:0, sig:'', stick:true, err:'', loaded:false, expanded:{}, legacy:false };
  var LONG_BODY = 600;
  var panelWide = false;
  try { panelWide = localStorage.getItem('agistry_panel_wide') === '1'; } catch (err) {}

  function authHeaders(){ return { 'X-Registry-Token': tok.value.trim() }; }
  // the name the server gives this agent's messages: task:role, or its session id without a role
  function agentIdent(n){ return n.role ? (n.task || '') + ':' + n.role : n.id; }
  function splitIdent(s){
    var i = (s || '').indexOf(':');
    return i < 0 ? { task:'', role:(s || '').slice(0, 8) } : { task:s.slice(0, i), role:s.slice(i + 1) };
  }
  function identName(s){ var p = splitIdent(s); return p.role === '*' ? 'everyone in ' + p.task : p.role; }
  function dayLabel(ts){
    var d = new Date(ts * 1000), today = new Date(), y = new Date();
    y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'today';
    if (d.toDateString() === y.toDateString()) return 'yesterday';
    return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }
  function clock(ts){ return new Date(ts * 1000).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); }

  function resetPanelChat(sid, me){
    pchat = { sid:sid, me:me, convs:[], convsLoaded:false, convSig:'', withId:'', msgs:[], hasMore:false,
              seq:pchat.seq + 1, sig:'', stick:true, err:'', loaded:false, expanded:{}, legacy:pchat.legacy };
  }

  function renderNodePanel(n){
    if (!n){ nodePanel.hidden = true; return; }
    if (n.kind === 'resource'){ nodePanel.classList.remove('agent'); pchat.sid = null; renderResourcePanel(n); return; }
    renderAgentPanel(n);
  }

  function agentHeadHtml(n){
    return '<span class="dot ' + esc(n.state) + '"></span>' +
      '<span class="np-role">' + esc(n.role || 'unassigned') + '</span>' +
      (n.task ? '<span class="badge">' + esc(n.task) + '</span>' : '') +
      '<span class="grow"></span>' +
      '<button class="np-wide" id="npWide" title="' + (panelWide ? 'collapse panel' : 'expand panel') + '">' +
        (panelWide ? '⤡' : '⤢') + '</button>' +
      '<button class="np-close" id="npClose">×</button>';
  }
  function agentGridHtml(n){
    return '<dt>host</dt><dd title="' + esc(n.host) + '">' + esc(n.host || '—') + '</dd>' +
      '<dt>session</dt><dd title="' + esc(n.id) + '">' + esc((n.id || '').slice(0, 16)) + '</dd>' +
      '<dt>cwd</dt><dd title="' + esc(n.cwd) + '">' + esc(n.cwd || '—') + '</dd>' +
      '<dt>seen</dt><dd>' + rel(n.last_seen) + ' ago · ' + esc(n.state) + '</dd>';
  }

  function renderAgentPanel(n){
    var me = agentIdent(n);
    if (pchat.legacy){
      // the server has no /conversations: fall back to the old list, and keep probing so a
      // restarted server switches to the chat on the next poll
      nodePanel.classList.remove('agent');
      if (pchat.sid !== n.id) resetPanelChat(n.id, me);
      legacyAgentPanel(n);
      loadPanelConvs();
      return;
    }
    if (pchat.sid !== n.id || !document.getElementById('npThread')){
      resetPanelChat(n.id, me);
      nodePanel.classList.add('agent');
      nodePanel.classList.toggle('wide', panelWide);
      nodePanel.innerHTML =
        '<div class="np-top"><div class="np-head" id="npHead">' + agentHeadHtml(n) + '</div>' +
        '<dl class="np-grid" id="npGrid">' + agentGridHtml(n) + '</dl></div>' +
        '<div class="np-chat"><div class="np-with" id="npWith"><span class="np-with-one">loading conversations…</span></div>' +
        '<div class="np-thread" id="npThread"><div class="chat-empty">loading…</div></div></div>';
    } else {
      document.getElementById('npHead').innerHTML = agentHeadHtml(n);
      document.getElementById('npGrid').innerHTML = agentGridHtml(n);
    }
    loadPanelConvs();
  }

  function loadPanelConvs(){
    var sid = pchat.sid, me = pchat.me;
    if (!sid) return;
    fetch('/conversations?limit=100&with=' + encodeURIComponent(me), { headers: authHeaders() })
      .then(function(r){
        if (r.status === 404) throw new Error('old-server');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){
        if (pchat.sid !== sid) return;
        if (pchat.legacy){   // server was upgraded under us: rebuild as a chat
          pchat.legacy = false; pchat.sid = null;
          if (selected && nodesById[selected]) renderNodePanel(nodesById[selected]);
          return;
        }
        pchat.convs = d.conversations || []; pchat.convsLoaded = true; pchat.err = '';
        var others = pchat.convs.map(function(c){ return c.a === me ? c.b : c.a; });
        if (!pchat.withId || others.indexOf(pchat.withId) < 0){
          // open on whoever it talked to most recently
          pchat.withId = others[0] || '';
          pchat.msgs = []; pchat.hasMore = false; pchat.sig = ''; pchat.stick = true; pchat.loaded = false;
        }
        renderWithPicker();
        loadPanelThread(false);
      })
      .catch(function(e){
        if (pchat.sid !== sid) return;
        if (e.message === 'old-server'){
          if (!pchat.legacy){ pchat.legacy = true; if (selected && nodesById[selected]) renderNodePanel(nodesById[selected]); }
          return;
        }
        pchat.err = e.message; pchat.sig = ''; renderPanelThread();
      });
  }

  function renderWithPicker(){
    var el = document.getElementById('npWith');
    if (!el) return;
    var me = pchat.me;
    var sig = pchat.withId + '|' + pchat.convs.map(function(c){ return c.a + '/' + c.b + '/' + c.count + '/' + c.dead_lettered; }).join(',');
    if (sig === pchat.convSig) return;   // unchanged: do not disturb an open picker
    pchat.convSig = sig;
    function label(c){
      var other = c.a === me ? c.b : c.a, t = splitIdent(other).task;
      return { other: other,
        text: identName(other) + (t ? ' · ' + t : '') + ' · ' + c.count + ' message' + (c.count === 1 ? '' : 's') +
              (c.dead_lettered ? ' · ' + c.dead_lettered + ' never claimed' : '') };
    }
    if (!pchat.convs.length){ el.innerHTML = '<span class="np-with-one">no messages to or from this agent</span>'; return; }
    if (pchat.convs.length === 1){
      var one = label(pchat.convs[0]);
      el.innerHTML = '<span class="np-with-one">with <b>' + esc(one.text) + '</b></span>';
      return;
    }
    el.innerHTML = '<select id="npWithSel" title="conversations of this agent">' + pchat.convs.map(function(c){
      var l = label(c);
      return '<option value="' + esc(l.other) + '"' + (l.other === pchat.withId ? ' selected' : '') + '>' + esc('with ' + l.text) + '</option>';
    }).join('') + '</select>';
  }

  function loadPanelThread(earlier){
    var sid = pchat.sid, me = pchat.me, other = pchat.withId;
    if (!sid) return;
    if (!other){ pchat.sig = ''; renderPanelThread(); return; }
    var seq = ++pchat.seq;
    var before = earlier && pchat.msgs.length ? pchat.msgs[0].id : 0;
    fetch('/conversations/thread?a=' + encodeURIComponent(me) + '&b=' + encodeURIComponent(other) +
          '&limit=50' + (before ? '&before=' + before : ''), { headers: authHeaders() })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){
        if (pchat.sid !== sid || pchat.withId !== other) return;   // switched away meanwhile
        pchat.err = ''; pchat.loaded = true;
        var page = d.messages || [];
        if (earlier){
          var tb = document.getElementById('npThread'), prevH = tb ? tb.scrollHeight : 0, prevTop = tb ? tb.scrollTop : 0;
          pchat.msgs = page.concat(pchat.msgs);
          pchat.hasMore = d.has_more;
          renderPanelThread();
          tb = document.getElementById('npThread');
          if (tb) tb.scrollTop = prevTop + (tb.scrollHeight - prevH);   // keep the reader's place
          return;
        }
        if (seq !== pchat.seq) return;   // a newer request superseded this refresh
        // Fold the newest page into what is loaded. Earlier pages survive when the new page
        // overlaps what we hold; if not, more than a page arrived since, so drop the earlier
        // pages rather than show a silent gap.
        if (!page.length){ pchat.msgs = []; pchat.hasMore = false; }
        else {
          var floor = page[0].id;
          var held = pchat.msgs.length ? pchat.msgs[pchat.msgs.length - 1].id : 0;
          var keep = held && floor <= held ? pchat.msgs.filter(function(m){ return m.id < floor; }) : [];
          pchat.msgs = keep.concat(page);
          if (!keep.length) pchat.hasMore = d.has_more;
        }
        renderPanelThread();
      })
      .catch(function(e){ if (pchat.sid !== sid) return; pchat.err = e.message; pchat.sig = ''; renderPanelThread(); });
  }

  function renderPanelThread(){
    var tb = document.getElementById('npThread');
    if (!tb) return;
    var me = pchat.me;
    // skip identical re-renders, so a poll does not wipe a text selection
    var sig = pchat.withId + '|' + pchat.hasMore + '|' + pchat.err + '|' + pchat.loaded + '|' + pchat.convsLoaded + '|' +
      pchat.msgs.map(function(m){ return m.id + (m.delivered ? 'd' : '') + (m.dead_lettered ? 'x' : '') + (pchat.expanded[m.msg_id] ? 'e' : ''); }).join(',');
    if (sig === pchat.sig) return;
    pchat.sig = sig;

    var atBottom = pchat.stick || (tb.scrollHeight - tb.scrollTop - tb.clientHeight < 40);
    var prevTop = tb.scrollTop;
    var h = [];
    if (pchat.hasMore) h.push('<button class="earlier" id="npEarlier">load earlier messages</button>');
    if (!pchat.msgs.length){
      h.push('<div class="chat-empty">' + (
        pchat.err ? 'could not load messages: ' + esc(pchat.err)
        : pchat.convsLoaded && !pchat.withId ? 'no messages to or from this agent yet'
        : pchat.loaded ? 'no messages in this conversation (they may have aged out)'
        : 'loading…') + '</div>');
    }
    var lastDay = '', lastSide = '';
    pchat.msgs.forEach(function(m){
      var day = dayLabel(m.created_at);
      if (day !== lastDay){ h.push('<div class="daysep">' + esc(day) + '</div>'); lastDay = day; lastSide = ''; }
      var side = m.from_identity === me ? 'right' : 'left';
      var body = m.body || '', isLong = body.length > LONG_BODY, clipped = isLong && !pchat.expanded[m.msg_id];
      var mark = m.dead_lettered ? '<span class="mark dead" title="the recipient never picked this up">✕ never claimed</span>'
               : m.delivered ? '<span class="mark" title="delivered">✓</span>'
               : '<span class="mark pend" title="waiting in the mailbox">◷ waiting</span>';
      h.push('<div class="row ' + side + (side !== lastSide ? ' turn' : '') + '"><div class="bubble" title="' + esc(m.from_identity) + '">' +
        esc(clipped ? body.slice(0, LONG_BODY) + '…' : body) +
        (isLong ? '<button class="more" data-mid="' + esc(m.msg_id) + '">' + (clipped ? 'show more' : 'show less') + '</button>' : '') +
        '<div class="bubble-foot"><span title="' + esc(new Date(m.created_at * 1000).toLocaleString()) + '">' + clock(m.created_at) + '</span>' + mark + '</div>' +
        '</div></div>');
      lastSide = side;
    });
    tb.innerHTML = h.join('');
    tb.scrollTop = atBottom ? tb.scrollHeight : prevTop;
    if (pchat.msgs.length) pchat.stick = false;
  }

  nodePanel.addEventListener('click', function(e){
    var t = e.target;
    if (t.id === 'npClose'){ selected = null; nodePanel.hidden = true; return; }
    if (t.id === 'npWide'){
      var tbw = document.getElementById('npThread');
      var wasBottom = !tbw || (tbw.scrollHeight - tbw.scrollTop - tbw.clientHeight < 40);
      panelWide = !panelWide;
      try { localStorage.setItem('agistry_panel_wide', panelWide ? '1' : '0'); } catch (err) {}
      nodePanel.classList.toggle('wide', panelWide);
      t.textContent = panelWide ? '⤡' : '⤢';
      t.title = panelWide ? 'collapse panel' : 'expand panel';
      // re-wrapping changes the height, so hold the newest message in view
      if (wasBottom && tbw) tbw.scrollTop = tbw.scrollHeight;
      return;
    }
    if (t.id === 'npEarlier'){ t.disabled = true; t.textContent = 'loading…'; loadPanelThread(true); return; }
    if (t.classList && t.classList.contains('more')){
      var mid = t.getAttribute('data-mid');
      pchat.expanded[mid] = !pchat.expanded[mid];
      renderPanelThread();
    }
  });
  nodePanel.addEventListener('change', function(e){
    if (e.target.id !== 'npWithSel') return;
    pchat.withId = e.target.value;
    pchat.msgs = []; pchat.hasMore = false; pchat.sig = ''; pchat.convSig = ''; pchat.stick = true; pchat.loaded = false; pchat.err = '';
    renderWithPicker(); renderPanelThread(); loadPanelThread(false);
  });

  // The panel before it became a chat: a stacked list. Used only against a server that
  // predates /conversations.
  function legacyAgentPanel(n){
    var a = { session_id:n.id, task:n.task, role:n.role, host:n.host, cwd:n.cwd, state:n.state, last_seen:n.last_seen };
    var ms = messagesFor(a).slice(0, 12);
    var h = ['<div class="np-head">',
      '<span class="dot ' + esc(n.state) + '"></span>',
      '<span class="np-role">' + esc(n.role || 'unassigned') + '</span>',
      '<button class="np-close" id="npClose">×</button></div>'];
    h.push('<dl class="np-grid">');
    h.push('<dt>state</dt><dd>' + esc(n.state) + '</dd>');
    h.push('<dt>task</dt><dd title="'+esc(n.task)+'">' + esc(n.task || '—') + '</dd>');
    h.push('<dt>host</dt><dd title="'+esc(n.host)+'">' + esc(n.host || '—') + '</dd>');
    h.push('<dt>session</dt><dd title="'+esc(n.id)+'">' + esc((n.id||'').slice(0,16)) + '</dd>');
    h.push('<dt>cwd</dt><dd title="'+esc(n.cwd)+'">' + esc(n.cwd || '—') + '</dd>');
    h.push('<dt>seen</dt><dd>' + rel(n.last_seen) + ' ago</dd>');
    h.push('</dl>');
    h.push('<div class="np-sec">messages · ' + ms.length + '</div>');
    if (!ms.length) h.push('<div class="nomsg">no recent messages</div>');
    else {
      h.push('<div class="msgs">');
      ms.forEach(function(m){
        var outgoing = m.from === n.id;
        var whoFull = outgoing ? (m.to_session || ((m.to_task||'')+':'+(m.to_role||''))) : (m.from||'');
        var who = outgoing ? (m.to_session ? m.to_session.slice(0,8) : ((m.to_task||'')+':'+(m.to_role||''))) : (m.from||'').slice(0,8);
        var st = msgStatus(m);
        h.push('<div class="msg" style="grid-template-columns:36px 14px 1fr 12px; cursor:default">' +
          '<span class="m-time">' + rel(m.created_at) + '</span>' +
          '<span class="m-dir' + (outgoing?' out':'') + '">' + (outgoing?'↗':'↙') + '</span>' +
          '<span class="m-who" title="'+esc(whoFull)+'">' + esc(who) + '</span>' +
          '<span class="dot ' + st + '" title="'+st+'"></span>' +
          '<div class="m-full" style="margin-top:2px">' + esc((m.body||'').slice(0,400)) + ((m.body||'').length>400?'…':'') + '</div>' +
        '</div>');
      });
      h.push('</div>');
    }
    nodePanel.innerHTML = h.join('');
    var cl = document.getElementById('npClose');
    if (cl) cl.onclick = function(){ selected = null; nodePanel.hidden = true; };
  }

  // =====================================================================
  //  VIEW SWITCH + DATA LOAD
  // =====================================================================
  function applyView(){
    var graph = view === 'graph';
    graphView.hidden = !graph;
    tableView.hidden = graph;
    idleWrap.style.display = graph ? '' : 'none';
    Array.prototype.forEach.call(viewtog.children, function(b){
      b.classList.toggle('on', b.getAttribute('data-view') === view);
    });
    localStorage.setItem('agistry_view', view);
    if (graph){ buildGraph(); startGraph(); }
    else { stopGraph(); renderTable(); }
  }
  viewtog.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    view = b.getAttribute('data-view'); applyView();
  });

  function render(){
    var a = lastAgents.agents || [];
    var active = a.filter(function(x){return x.state==='active';}).length;
    var hosts = {}; a.forEach(function(x){ if (x.host) hosts[x.host]=1; });
    var nh = Object.keys(hosts).length;
    var rs = lastResources, rh = rs.filter(function(r){ return r.held; }).length;
    summary.textContent = a.length + ' agents · ' + active + ' active' + (nh? ' · ' + nh + ' host' + (nh>1?'s':'') : '') +
      (rs.length ? ' · ' + rs.length + ' resource' + (rs.length>1?'s':'') + ' (' + rh + ' held)' : '');
    if (view === 'graph'){ buildGraph(); }
    else { renderTable(); }
  }

  function load(){
    var t = tok.value.trim();
    localStorage.setItem('registry_token', t);
    var url = '/agents' + (gone.checked ? '?all=1' : '');
    Promise.all([
      fetch(url, { headers: { 'X-Registry-Token': t } }).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
      fetch('/messages?limit=200', { headers: { 'X-Registry-Token': t } }).then(function(r){ return r.ok ? r.json() : {messages:[]}; }),
      // an older server has no /resources; show agents anyway rather than failing the page
      fetch('/resources' + (gone.checked ? '?all=1' : ''), { headers: { 'X-Registry-Token': t } })
        .then(function(r){ return r.ok ? r.json() : {resources:[]}; })
        .catch(function(){ return {resources:[]}; })
    ]).then(function(res){
      lastAgents = res[0]; lastMessages = res[1].messages || [];
      lastResources = res[2].resources || []; resFetchedAt = Date.now();
      render();
      statusEl.className='status'; statusEl.textContent = 'updated ' + new Date().toLocaleTimeString();
    }).catch(function(e){
      statusEl.className='status err'; statusEl.textContent = 'error: ' + e.message + (String(e.message).indexOf('401')>=0 ? ' (check token)' : '');
    });
  }

  function schedule(){
    if (timer) clearInterval(timer);
    var ms = parseInt(every.value, 10);
    if (ms > 0) timer = setInterval(load, ms);
  }

  document.getElementById('refresh').onclick = load;
  every.onchange = schedule;
  gone.onchange = load;
  idle.onchange = function(){ if (view==='graph') buildGraph(); };
  tok.onchange = load;

  applyView();
  load(); schedule();
})();
</script>
</body>
</html>
